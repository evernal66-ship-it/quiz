<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="app">

  <header class="topbar">
    <h1>期末冲刺<span class="sub">习概 · 272题</span></h1>
    <button class="icon-btn" id="btn-filter" aria-label="筛选">☰</button>
  </header>

  <main id="main">
    <section class="screen on" id="screen-quiz"></section>
    <section class="screen" id="screen-short"></section>
    <section class="screen" id="screen-essay"></section>
    <section class="screen" id="screen-me"></section>
  </main>

  <nav class="tabbar">
    <button data-t="quiz" class="on"><span class="t-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.5 8.5l-4-4L4 16v4z"/><path d="M14.5 5.5l4 4"/></svg></span>刷题</button>
    <button data-t="short"><span class="t-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span>简答</button>
    <button data-t="essay"><span class="t-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h7l4.5 4.5V21h-11.5z"/><path d="M13 3v5h5"/><path d="M9 13h6M9 16.5h4"/></svg></span>论述</button>
    <button data-t="me"><span class="t-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20.5c0-3.5 3.1-5.8 7-5.8s7 2.3 7 5.8"/></svg></span>我的</button>
  </nav>

</div>

<div class="sheet-mask" id="sheet-mask">
  <div class="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
</div>
<div id="toast"></div>
